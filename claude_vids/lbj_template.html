      <div class="clip bg" id="bg-night" data-start="4.8" data-duration="4.8" data-track-index="1"><div class="bg-fill"></div><div class="stars" id="stars"></div></div>
      <div class="clip bg" id="bg-day" data-start="9.6" data-duration="14.4" data-track-index="1"><div class="bg-fill"></div></div>
      <div class="clip bg" id="bg-burst1" data-start="24" data-duration="9.6" data-track-index="1"><div class="burst-wrap"><div class="burst"></div></div></div>
      <div class="clip bg" id="bg-cream" data-start="33.6" data-duration="9.6" data-track-index="1"><div class="bg-fill"></div></div>
      <div class="clip bg" id="bg-war" data-start="43.2" data-duration="7.2" data-track-index="1"><div class="bg-fill"></div></div>
      <div class="clip bg" id="bg-dusk" data-start="50.4" data-duration="2.4" data-track-index="1"><div class="bg-fill"></div></div>
      <div class="clip bg" id="bg-burst2" data-start="52.8" data-duration="9.6" data-track-index="1"><div class="burst-wrap"><div class="burst"></div></div></div>
      <div class="clip bg" id="bg-tag" data-start="62.4" data-duration="__TAG_REST__" data-track-index="1"><div class="bg-fill"></div></div>

      <!-- scenes -->
      __SCENES__

      <!-- Clawd -->
      <div id="clawd-pos">
        <div id="clawd-bob"><div id="clawd-sq">
          <svg id="clawd" viewBox="0 -6 16 20" shape-rendering="crispEdges">
            <g id="c-legs" fill="#b85f42"><rect x="3" y="10" width="1" height="2"/><rect x="5" y="10" width="1" height="2"/><rect x="10" y="10" width="1" height="2"/><rect x="12" y="10" width="1" height="2"/></g>
            <rect id="c-armL" x="0" y="6" width="2" height="2" fill="#d97757"/>
            <rect id="c-armR" x="14" y="6" width="2" height="2" fill="#d97757"/>
            <rect id="c-body" x="2" y="3" width="12" height="7" fill="#d97757"/>
            <g id="c-eyes" fill="#1a1a1a"><rect x="5" y="5" width="1" height="2"/><rect x="10" y="5" width="1" height="2"/></g>
            <g id="c-stars" fill="#f2c14e" opacity="0" shape-rendering="auto"><path d="M5.5 4.6 L5.8 5.5 L6.7 5.6 L6 6.1 L6.3 7 L5.5 6.5 L4.7 7 L5 6.1 L4.3 5.6 L5.2 5.5Z"/><path d="M10.5 4.6 L10.8 5.5 L11.7 5.6 L11 6.1 L11.3 7 L10.5 6.5 L9.7 7 L10 6.1 L9.3 5.6 L10.2 5.5Z"/></g>
            <rect id="c-mouth" x="7" y="7.6" width="2" height="1.2" fill="#5a2415" shape-rendering="auto" rx="0.4"/>
            <g id="c-hat" shape-rendering="auto">
              <path d="M4.2 2.6 L4.6 -1.2 Q5.2 -2.2 6.6 -1.4 Q8 -2.4 9.4 -1.4 Q10.8 -2.2 11.4 -1.2 L11.8 2.6Z" fill="#9b6a3a"/>
              <rect x="4.3" y="1.1" width="7.4" height="0.9" fill="#3a2410"/>
              <path d="M0.6 2.2 Q1.2 3.6 3 3.3 L13 3.3 Q14.8 3.6 15.4 2.2 Q15.8 1.4 15 1.8 Q14 2.6 12.4 2.4 L3.6 2.4 Q2 2.6 1 1.8 Q0.2 1.4 0.6 2.2Z" fill="#7a4a22"/>
              <path d="M7.5 0.2 L8 -0.9 L8.5 0.2Z" fill="#f2c14e"/>
            </g>
          </svg>
          <div class="emote" id="emote">!</div>
        </div></div>
      </div>

      <!-- captions -->
      __CAPTIONS__
    </div>

    <script>
      const S = window.SONG, MOUTH = window.MOUTH;
      const BAR = S.bar, BEAT = BAR / 4, SEC = S.sections;
      const TAG_A = __TAG_A__, TAG_B = __TAG_B__, HIT = __HIT__, END = __END__;
      const at = (sec, i) => SEC[sec] + i * BAR;
      const tl = gsap.timeline({ paused: true });

      function rng(seed) {
        return () => {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = rng(1963);
      const q = (s) => document.querySelector(s);
      const qa = (s) => Array.from(document.querySelectorAll(s));

      // ---------- generated decor ----------
      const stars = q("#stars");
      for (let i = 0; i < 70; i++) {
        const s = document.createElement("i");
        s.style.left = rand() * 1920 + "px";
        s.style.top = rand() * 700 + "px";
        s.style.opacity = (0.3 + rand() * 0.7).toFixed(2);
        stars.appendChild(s);
      }
      const CONF_COLORS = ["#f2c14e", "#e8577d", "#7ec8e3", "#2e9d5b", "#f4ede4", "#d97757"];
      function confetti(sel, t0) {
        const box = q(sel);
        for (let i = 0; i < 70; i++) {
          const c = document.createElement("i");
          c.style.background = CONF_COLORS[i % CONF_COLORS.length];
          box.appendChild(c);
          const ang = rand() * Math.PI * 2, sp = 300 + rand() * 700;
          const dx = Math.cos(ang) * sp, dy = Math.sin(ang) * sp * 0.7 - 200;
          tl.fromTo(c, { x: 0, y: 0, rotation: 0, opacity: 1 },
            { x: dx, y: dy + 500, rotation: rand() * 720 - 360, opacity: 0.9, duration: 2.2, ease: "power1.out" }, t0 + rand() * 0.1);
        }
      }

      // ---------- scene entrances ----------
      qa(".scene").forEach((sc) => {
        const t = parseFloat(sc.dataset.start);
        tl.fromTo(sc.querySelector(".in"), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, t);
      });
      qa(".burst").forEach((b) => {
        const t = parseFloat(b.closest(".clip").dataset.start);
        tl.fromTo(b, { rotation: 0 }, { rotation: 120, duration: BAR * 4, ease: "none" }, t);
      });

      // intro
      tl.from(".intro-star", { rotation: -90, scale: 0.3, duration: 1.2, ease: "back.out(1.5)" }, 0.1);
      ["it1", "it2", "it3"].forEach((c, i) => tl.from("." + c, { y: -500, scale: 1.8, opacity: 0, duration: 0.35, ease: "bounce.out" }, 2.4 + i * BEAT));
      tl.from(".intro-title .dot", { scale: 0, duration: 0.2, stagger: BEAT }, 2.4 + BEAT * 0.5);
      tl.from(".intro-sub", { y: 40, opacity: 0, duration: 0.4 }, 0.5);
      tl.from(".intro-credit", { y: 40, opacity: 0, duration: 0.4 }, 1.0);

      // v1
      let t = at("v1", 0);
      tl.from(".cal", { y: -700, rotation: -8, duration: 0.6, ease: "bounce.out" }, t);
      tl.from(".k-left", { x: -80, opacity: 0, duration: 0.4 }, t + 0.8);
      t = at("v1", 1);
      tl.fromTo(".plane", { x: -900, y: 80, rotation: -6 }, { x: 1300, y: -60, rotation: -3, duration: BAR, ease: "power1.inOut" }, t);
      tl.from(".t-mid", { scale: 0.4, opacity: 0, duration: 0.35, ease: "back.out(3)" }, t + 0.5);
      t = at("v1", 2);
      tl.from(".fig-wrap.tall", { scaleY: 0.2, transformOrigin: "50% 100%", duration: 0.6, ease: "elastic.out(1,0.5)" }, t + 0.1);
      tl.from(".height-tag", { scale: 0, rotation: 20, duration: 0.4, ease: "back.out(3)" }, t + 0.9);
      t = at("v1", 3);
      tl.fromTo(".fig-wrap.lean", { rotation: 0, x: 0 }, { rotation: 14, x: 120, transformOrigin: "50% 100%", duration: 0.5, ease: "power2.out" }, t + 0.1);
      tl.fromTo(".senator", { scale: 1, x: 0 }, { scale: 0.7, x: 60, transformOrigin: "50% 100%", duration: 0.5 }, t + 0.2);
      tl.from(".sweat", { y: -30, opacity: 0, duration: 0.3, stagger: 0.2 }, t + 0.6);
      tl.from(".st-treat", { scale: 3, rotation: -25, opacity: 0, duration: 0.25, ease: "power4.in" }, t + 1.1);
      tl.to(".st-treat", { rotation: -6, duration: 0.1 }, t + 1.35);
      t = at("v1", 4);
      tl.from(".doc", { y: 900, duration: 0.45, ease: "power3.out" }, t);
      tl.fromTo("#sigpath", { strokeDasharray: 900, strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 1.0, ease: "power1.inOut" }, t + 0.5);
      tl.from(".st-law", { scale: 3, rotation: 30, opacity: 0, duration: 0.2, ease: "power4.in" }, t + 1.6);
      t = at("v1", 5);
      tl.from(".b-lbj", { width: 0, duration: 0.9, ease: "power3.out" }, t + 0.2);
      tl.from(".b-gw", { width: 0, duration: 0.9, ease: "power3.out" }, t + 0.2);
      tl.fromTo("#cnt-lbj", { innerText: 0 }, { innerText: 486, snap: { innerText: 1 }, duration: 0.9, ease: "power3.out" }, t + 0.2);
      tl.fromTo("#cnt-gw", { innerText: 0 }, { innerText: 52, snap: { innerText: 1 }, duration: 0.9, ease: "power3.out" }, t + 0.2);
      tl.from(".st-land", { scale: 3, rotation: 25, opacity: 0, duration: 0.2, ease: "power4.in" }, t + 1.3);
      t = at("v1", 6);
      tl.from(".t-top", { y: -120, opacity: 0, duration: 0.35 }, t);
      qa(".ballot").forEach((b, i) => {
        tl.fromTo(b, { y: -500, rotation: -20 + i * 13, opacity: 1 }, { y: 0, rotation: 0, duration: 0.35, ease: "power2.in" }, t + 0.2 + i * 0.3);
        tl.to(b, { y: 380, scaleY: 0.2, opacity: 0, duration: 0.2, ease: "power2.in" }, t + 0.55 + i * 0.3);
      });
      tl.fromTo(".bbox", { scaleY: 1 }, { scaleY: 0.92, transformOrigin: "50% 100%", duration: 0.08, yoyo: true, repeat: 7 }, t + 0.7);
      t = at("v1", 7);
      tl.from(".mega", { scale: 0, rotation: -10, duration: 0.45, ease: "back.out(3)" }, t);
      confetti("#conf1", t + 0.1);

      // choruses
      ["ch1", "ch2"].forEach((sec) => {
        const words = S.words.filter((w) => w.sec === sec && ["L", "B", "J"].includes(w.w));
        [0, 2].forEach((line) => {
          const slot = line === 0 ? "a" : "c";
          words.filter((w) => w.line === line).forEach((w, k) => {
            tl.fromTo(`#s-${sec}-${slot} .lt${k + 1}`, { scale: 3, opacity: 0, rotation: k % 2 ? 12 : -12 },
              { scale: 1, opacity: 1, rotation: 0, duration: 0.18, ease: "back.out(3)" }, w.t);
          });
          tl.to(`#s-${sec}-${slot} .lbj-letters`, { y: 20, duration: BEAT / 2, yoyo: true, repeat: 5, ease: "sine.inOut" }, at(sec, line) + BEAT);
        });
      });
      t = at("ch1", 1);
      tl.from(".banner", { scaleX: 0, duration: 0.4, ease: "back.out(2)" }, t);
      confetti("#conf-ch1", t + 0.8);
      t = at("ch1", 3);
      tl.fromTo(".lone-star", { rotation: -180, scale: 0 }, { rotation: 0, scale: 1, duration: 0.7, ease: "back.out(2)" }, t);
      t = at("ch2", 1);
      tl.from(".half.win", { x: -800, duration: 0.4, ease: "power3.out" }, t);
      tl.from(".half.war", { x: 800, duration: 0.4, ease: "power3.out" }, t + 0.9);
      t = at("ch2", 3);
      tl.fromTo(".beam", { rotation: -10 }, { rotation: 10, duration: BEAT, yoyo: true, repeat: 3, ease: "sine.inOut" }, t);

      // v2
      t = at("v2", 0);
      tl.from(".c1", { y: -500, rotation: -15, duration: 0.4, ease: "back.out(2)" }, t);
      tl.from(".c2", { y: -500, rotation: 15, duration: 0.4, ease: "back.out(2)" }, t + 0.9);
      tl.from(".bus", { x: -1400, duration: 0.8, ease: "power3.out" }, t + 0.3);
      t = at("v2", 1);
      tl.from(".m1", { rotationY: 90, duration: 0.35, ease: "back.out(2)" }, t);
      tl.from(".m2", { rotationY: 90, duration: 0.35, ease: "back.out(2)" }, t + 0.7);
      t = at("v2", 2);
      tl.from(".passport", { x: -700, rotation: -20, duration: 0.4 }, t);
      tl.from(".pp-stamp", { scale: 2.5, opacity: 0, rotation: -30, duration: 0.2, ease: "power4.in" }, t + 0.6);
      tl.from(".school", { y: 800, duration: 0.45, ease: "back.out(1.4)" }, t + 1.1);
      t = at("v2", 3);
      tl.from(".court", { y: 60, opacity: 0, duration: 0.4 }, t);
      tl.fromTo(".gavel", { rotation: -40 }, { rotation: 10, transformOrigin: "40% 90%", duration: 0.12, ease: "power4.in", yoyo: true, repeat: 3 }, t + 0.5);
      tl.from(".tm-card", { y: 200, opacity: 0, duration: 0.35 }, t + 0.3);
      t = at("v2", 4);
      tl.from(".stencil", { opacity: 0, scale: 1.4, duration: 0.3 }, t);
      tl.fromTo("#troopline", { strokeDasharray: 1100, strokeDashoffset: 1100 }, { strokeDashoffset: 0, duration: 1.6, ease: "power2.in" }, t + 0.3);
      t = at("v2", 5);
      tl.fromTo("#cnt-troops", { innerText: 0 }, { innerText: 536, snap: { innerText: 1 }, duration: 1.2, ease: "power2.out" }, t + 0.1);
      qa(".sign").forEach((s, i) => {
        tl.from(s, { scale: 0, opacity: 0, duration: 0.35, ease: "back.out(2)" }, t + 0.3 + i * 0.15);
        tl.to(s, { y: -30, rotation: i % 2 ? 6 : -6, duration: BEAT / 2, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.8 + i * 0.1);
      });
      t = at("v2", 6);
      tl.from(".tv", { scale: 0.2, opacity: 0, duration: 0.3, ease: "back.out(2)" }, t);
      tl.from(".tv-q", { opacity: 0, duration: 0.3 }, t + 0.3);
      tl.fromTo(".scan", { y: 0 }, { y: 28, duration: BAR, ease: "none" }, t);
      t = at("v2", 7);
      tl.fromTo(".sun", { y: 0 }, { y: 180, duration: BAR, ease: "none" }, t);
      tl.from(".ranch-sign", { rotation: -30, y: -300, duration: 0.5, ease: "bounce.out" }, t + 0.2);

      // tag
      const nt = qa(".nametag");
      const nameTimes = [TAG_A + 0.05, TAG_A + 0.9, TAG_A + 2.3, TAG_A + 3.4];
      tl.from(".funfact", { scale: 0, rotation: -12, duration: 0.3, ease: "back.out(3)" }, SEC.tag);
      nt.forEach((n, i) => tl.from(n, { scale: 0, rotation: i % 2 ? 8 : -8, duration: 0.3, ease: "back.out(2.5)" }, nameTimes[i]));
      tl.from(".nt-n b", { color: "#1f1a17", duration: 0.2, stagger: 0.05 }, TAG_B - 1.0);
      tl.to(".family", { scale: 0.62, x: 240, y: -40, transformOrigin: "0 0", duration: 0.3, ease: "power2.inOut" }, TAG_B - 0.3);
      tl.from(".dog", { y: 600, duration: 0.35, ease: "back.out(2)" }, TAG_B - 0.1);
      tl.from(".dog-tag", { scale: 0, duration: 0.3, ease: "back.out(3)" }, TAG_B + 0.3);
      tl.from(".end-title", { scale: 0, rotation: -8, duration: 0.45, ease: "back.out(3)" }, HIT);
      tl.from(".end-sub", { y: 60, opacity: 0, duration: 0.4 }, HIT + 0.4);
      confetti("#conf-end", HIT + 0.05);

      // ---------- captions ----------
      qa(".cap").forEach((c) => {
        const t0 = parseFloat(c.dataset.start);
        tl.from(c.querySelector(".cap-in"), { y: 40, opacity: 0, duration: 0.15 }, t0);
      });
      qa(".w").forEach((w) => {
        const t0 = parseFloat(w.dataset.t);
        tl.to(w, { color: "#f2c14e", duration: 0.05 }, t0);
        tl.fromTo(w, { scale: 1 }, { scale: 1.1, duration: 0.1, yoyo: true, repeat: 1 }, t0);
      });

      // ---------- Clawd ----------
      const P = (tt, x, y, s, d = 0.4, ease = "back.out(1.6)") =>
        tl.to("#clawd-pos", { x, y, scale: s, duration: d, ease, transformOrigin: "0 0" }, tt);
      tl.set("#clawd-pos", { x: 1420, y: 1150, scale: 1, transformOrigin: "0 0" }, 0);
      P(0.15, 1420, 520, 1, 0.6, "back.out(1.4)");
      P(at("v1", 0), 1500, 520, 0.85);
      P(at("v1", 7), 784, 470, 1.15);
      P(at("ch1", 0), 784, 470, 1.1);
      P(at("v2", 0), 1500, 520, 0.85);
      P(at("v2", 7), 1150, 520, 0.8, 0.3);
      tl.to("#clawd-pos", { x: 1540, duration: BAR - 0.4, ease: "none" }, at("v2", 7) + 0.3);
      P(at("ch2", 0), 784, 470, 1.1);
      P(SEC.tag, 1480, 480, 0.9);
      P(HIT, 784, 500, 1.1);

      // hat tip in the intro + stars eyes on BIG DEAL / choruses
      tl.to("#c-hat", { rotation: -25, y: -1.5, svgOrigin: "8 2", duration: 0.25, yoyo: true, repeat: 1, repeatDelay: 0.5 }, 1.0);
      const starEyes = (t0, t1) => {
        tl.set("#c-eyes", { opacity: 0 }, t0); tl.set("#c-stars", { opacity: 1 }, t0);
        tl.set("#c-eyes", { opacity: 1 }, t1); tl.set("#c-stars", { opacity: 0 }, t1);
      };
      starEyes(at("v1", 7), at("ch1", 0) + BAR);
      starEyes(at("ch2", 0), at("ch2", 0) + BAR);
      starEyes(HIT, END);
      // look up at the 6'4" Texan; sad at Dallas & Vietnam
      tl.to("#c-eyes", { y: -1, duration: 0.2 }, at("v1", 2)); tl.to("#c-eyes", { y: 0, duration: 0.2 }, at("v1", 4));
      tl.to("#c-eyes", { scaleY: 0.5, svgOrigin: "8 7", duration: 0.2 }, at("v1", 0)); tl.to("#c-eyes", { scaleY: 1, duration: 0.2 }, at("v1", 1));
      tl.to("#c-eyes", { scaleY: 0.5, svgOrigin: "8 7", duration: 0.2 }, at("v2", 4)); tl.to("#c-eyes", { scaleY: 1, duration: 0.2 }, at("v2", 7));
      // blinks
      [3.4, 8.2, 13.1, 18.7, 29.3, 36.9, 41.6, 51.2, 58.5, 64.1].forEach((b) =>
        tl.to("#c-eyes", { scaleY: 0.1, svgOrigin: "8 6", duration: 0.06, yoyo: true, repeat: 1 }, b));
      // emote on "Even the dog!"
      tl.fromTo("#emote", { opacity: 0, scale: 0, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.25, ease: "back.out(4)" }, TAG_B);
      tl.to("#emote", { opacity: 0, duration: 0.2 }, HIT);

      // beat bounce + squash, arm pumps (music sections only)
      const musicOn = (tt) => tt >= 2.4 && tt < SEC.tag - 0.05;
      for (let b = 0; b * BEAT < END; b++) {
        const tt = b * BEAT;
        if (!musicOn(tt)) continue;
        const big = b % 2 === 0;
        tl.to("#clawd-bob", { y: big ? -34 : -18, duration: BEAT * 0.35, ease: "power2.out" }, tt);
        tl.to("#clawd-bob", { y: 0, duration: BEAT * 0.55, ease: "power2.in" }, tt + BEAT * 0.35);
        tl.fromTo("#clawd-sq", { scaleX: 1.1, scaleY: 0.9 }, { scaleX: 1, scaleY: 1, transformOrigin: "50% 100%", duration: BEAT * 0.5, ease: "elastic.out(1,0.4)" }, tt + BEAT * 0.9 - 0.001);
        const chorus = (tt >= SEC.ch1 && tt < SEC.v2) || (tt >= SEC.ch2 && tt < SEC.tag);
        const armAmp = chorus ? 3 : 1.2;
        tl.to("#c-armL", { y: b % 2 ? armAmp : -armAmp, duration: BEAT * 0.4, ease: "power2.out" }, tt);
        tl.to("#c-armR", { y: b % 2 ? -armAmp : armAmp, duration: BEAT * 0.4, ease: "power2.out" }, tt);
        if (chorus) tl.to("#clawd", { rotation: b % 2 ? 6 : -6, transformOrigin: "50% 100%", duration: BEAT * 0.5, ease: "sine.inOut" }, tt);
      }
      tl.to("#clawd", { rotation: 0, duration: 0.2 }, SEC.v2);
      tl.to("#clawd", { rotation: 0, duration: 0.2 }, SEC.tag);
      tl.to(["#c-armL", "#c-armR"], { y: 0, duration: 0.2 }, SEC.tag);
      // final wave
      tl.to("#c-armR", { y: -3, duration: 0.15, yoyo: true, repeat: 7 }, HIT + 0.2);

      // lip sync from the vocal envelope (30 fps)
      let last = -1;
      MOUTH.forEach((v, i) => {
        const lvl = Math.round(Math.min(1, v) * 4) / 4;
        if (lvl !== last) {
          tl.set("#c-mouth", { scaleY: 0.25 + lvl * 1.4, svgOrigin: "8 7.6" }, i / 30);
          last = lvl;
        }
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
